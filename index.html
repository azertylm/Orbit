<!doctype html>
<html lang="fr" data-theme="onyx">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ORBIT v2.0 — Réseau Social & Panthéon Vidéo Universel</title>
    <meta name="description" content="Réseau social et panthéon vidéo universel sur 15 domaines et 105 sous-domaines avec moteur d'affinité, classification IA Gemini, et connecteur YouTube." />
    <meta property="og:title" content="ORBIT v2.0 — Réseau Social & Panthéon Vidéo Universel" />
    <meta property="og:description" content="Réseau social et panthéon vidéo universel sur 15 domaines et 105 sous-domaines avec moteur d'affinité, classification IA Gemini, et connecteur YouTube." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Liaison PWA Mobile -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#7c5cff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ORBIT" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Google Identity Services OAuth2 Officiel -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      (function () {
        try {
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              var hadOld = false;
              Promise.all(
                keys.map(function (key) {
                  hadOld = true;
                  return caches.delete(key);
                })
              ).then(function () {
                if (hadOld && !sessionStorage.getItem('orbit_cache_cleared_v6')) {
                  sessionStorage.setItem('orbit_cache_cleared_v6', '1');
                  window.location.reload();
                }
              });
            });
          }
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker
              .getRegistrations()
              .then(function (regs) {
                regs.forEach(function (reg) {
                  try {
                    var p = reg.update();
                    if (p && typeof p.catch === 'function') {
                      p.catch(function () {});
                    }
                  } catch (err) {}
                });
              })
              .catch(function () {});
            window.addEventListener('load', function () {
              try {
                navigator.serviceWorker
                  .register('/sw.js', { updateViaCache: 'none' })
                  .catch(function () {});
              } catch (err) {}
            });
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body style="background-color: #090A0F; color: #FFFFFF; margin: 0;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
